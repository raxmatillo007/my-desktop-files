<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XIV Collections - Cart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar (nusxa) -->
  <nav class="navbar navbar-expand-lg fixed-top navbar-light">
    <!-- ... -->
  </nav>

  <!-- Cart -->
  <section class="cart py-5 mt-5">
    <div class="container">
      <h1>SHOPPING BAG</h1>
      <p>Favourites</p>
      <div class="row g-4">
        <div class="col-md-8">
          <div class="cart-item d-flex align-items-center mb-4">
            <img src="https://images.unsplash.com/photo-1552374196-1ab2a1c593e8?w=200" alt="Product" class="img-fluid me-3">
            <div>
              <h5>Cotton T-Shirt Full Sleeve Zipper</h5>
              <p>$99</p>
              <div class="d-flex align-items-center">
                <button class="btn btn-outline-dark">-</button>
                <input type="number" value="1" class="form-control mx-2" style="width: 60px;">
                <button class="btn btn-outline-dark">+</button>
              </div>
            </div>
            <button class="btn-close ms-auto"></button>
          </div>
          <!-- Yana bitta item takrorlang -->
        </div>
        <div class="col-md-4">
          <div class="order-summary p-4 bg-light">
            <h5>ORDER SUMMARY</h5>
            <div class="d-flex justify-content-between">
              <p>Subtotal</p>
              <p>$100</p>
            </div>
            <div class="d-flex justify-content-between">
              <p>Shipping</p>
              <p>$10</p>
            </div>
            <div class="d-flex justify-content-between fw-bold">
              <p>TOTAL (TAX INCL.)</p>
              <p>$110</p>
            </div>
            <button class="btn btn-dark w-100 mt-3">CONTINUE</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer (nusxa) -->
  <footer class="py-5 bg-dark text-white">
    <!-- ... -->
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
