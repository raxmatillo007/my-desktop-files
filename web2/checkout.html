<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XIV Collections - Checkout</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar (nusxa) -->
  <nav class="navbar navbar-expand-lg fixed-top navbar-light">
    <!-- ... -->
  </nav>

  <!-- Checkout -->
  <section class="checkout py-5 mt-5">
    <div class="container">
      <h1>CHECKOUT</h1>
      <ul class="nav mb-4">
        <li class="nav-item"><a class="nav-link active" href="#">INFORMATION</a></li>
        <li class="nav-item"><a class="nav-link" href="#">SHIPPING</a></li>
        <li class="nav-item"><a class="nav-link" href="#">PAYMENT</a></li>
      </ul>
      <div class="row g-4">
        <div class="col-md-6">
          <h6>CONTACT INFO</h6>
          <input type="email" class="form-control mb-3" placeholder="Email">
          <input type="tel" class="form-control mb-3" placeholder="Phone">
          <h6>SHIPPING ADDRESS</h6>
          <div class="row">
            <div class="col-6">
              <input type="text" class="form-control mb-3" placeholder="First Name">
            </div>
            <div class="col-6">
              <input type="text" class="form-control mb-3" placeholder="Last Name">
            </div>
          </div>
          <select class="form-select mb-3">
            <option>Country</option>
          </select>
          <input type="text" class="form-control mb-3" placeholder="State / Region">
          <input type="text" class="form-control mb-3" placeholder="Address">
          <div class="row">
            <div class="col-6">
              <input type="text" class="form-control mb-3" placeholder="City">
            </div>
            <div class="col-6">
              <input type="text" class="form-control mb-3" placeholder="Postal Code">
            </div>
          </div>
          <button class="btn btn-secondary">Shipping →</button>
        </div>
        <div class="col-md-6">
          <h6>YOUR ORDER (2)</h6>
          <div class="cart-item d-flex mb-3">
            <img src="https://images.unsplash.com/photo-1552374196-1ab2a1c593e8?w=100" alt="Product" class="me-3">
            <div>
              <h5>Basic Heavy T-Shirt</h5>
              <p>Black, L</p>
              <p>(1)</p>
            </div>
            <p class="ms-auto">$90</p>
          </div>
          <!-- Yana bitta item -->
          <div class="d-flex justify-content-between">
            <p>Subtotal</p>
            <p>$100.00</p>
          </div>
          <div class="d-flex justify-content-between fw-bold">
            <p>Total</p>
            <p>$100.00</p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer (nusxa) -->
  <footer class="py-5 bg-dark text-white">
    <!-- ... -->
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
