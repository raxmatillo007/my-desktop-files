<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XIV Collections - Product Detail</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar (nusxa) -->
  <nav class="navbar navbar-expand-lg fixed-top navbar-light">
    <!-- ... -->
  </nav>

  <!-- Product Detail -->
  <section class="product-detail py-5 mt-5">
    <div class="container">
      <div class="row g-4">
        <div class="col-md-6">
          <img src="https://images.unsplash.com/photo-1552374196-1ab2a1c593e8?w=800" alt="Main Product" class="img-fluid mb-3">
          <div class="thumbnails d-flex">
            <img src="https://images.unsplash.com/photo-1552374196-1ab2a1c593e8?w=200" alt="Thumb 1" class="img-thumbnail me-2">
            <img src="https://images.unsplash.com/photo-1551028719-00167b16eac5?w=200" alt="Thumb 2" class="img-thumbnail me-2">
            <img src="https://images.unsplash.com/photo-1554568218-0f1715e72254?w=200" alt="Thumb 3" class="img-thumbnail me-2">
            <img src="https://images.unsplash.com/photo-1551028719-00167b16eac5?w=200" alt="Thumb 4" class="img-thumbnail">
          </div>
        </div>
        <div class="col-md-6">
          <h1>ABSTRACT PRINT SHIRT</h1>
          <p class="price">$99</p>
          <p>MRP Incl. of all taxes</p>
          <p>Relaxed-fit shirt. Camp collar and short sleeves. Button-up front.</p>
          <h6>Color</h6>
          <div class="colors d-flex">
            <button class="color-swatch bg-gray"></button>
            <button class="color-swatch bg-black"></button>
            <button class="color-swatch bg-green"></button>
            <button class="color-swatch bg-white border"></button>
            <button class="color-swatch bg-blue"></button>
          </div>
          <h6>Size</h6>
          <div class="sizes d-flex">
            <button class="btn btn-outline-dark m-1">XS</button>
            <button class="btn btn-outline-dark m-1">S</button>
            <button class="btn btn-outline-dark m-1">M</button>
            <button class="btn btn-outline-dark m-1">L</button>
            <button class="btn btn-outline-dark m-1">XL</button>
            <button class="btn btn-outline-dark m-1">2X</button>
          </div>
          <p>FIND YOUR SIZE | MEASUREMENT GUIDE</p>
          <button class="btn btn-secondary w-100">ADD</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer (nusxa) -->
  <footer class="py-5 bg-dark text-white">
    <!-- ... -->
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
