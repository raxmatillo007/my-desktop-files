<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XIV Collections - Products</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar (index.html dagi bilan bir xil) -->
  <nav class="navbar navbar-expand-lg fixed-top navbar-light">
    <!-- ... (nusxa) -->
  </nav>

  <!-- Products Header -->
  <section class="products-header py-5 mt-5">
    <div class="container">
      <h1 class="text-center">PRODUCTS</h1>
      <form class="search-form mx-auto mt-4">
        <input type="search" class="form-control" placeholder="Search">
      </form>
      <ul class="nav justify-content-center mt-3">
        <li class="nav-item"><a class="nav-link" href="#">NEW</a></li>
        <li class="nav-item"><a class="nav-link" href="#">BEST SELLERS</a></li>
        <li class="nav-item"><a class="nav-link" href="#">SHIRTS</a></li>
        <li class="nav-item"><a class="nav-link" href="#">T-SHIRTS</a></li>
        <li class="nav-item"><a class="nav-link" href="#">JEANS</a></li>
        <li class="nav-item"><a class="nav-link" href="#">JACKETS</a></li>
        <li class="nav-item"><a class="nav-link" href="#">COATS</a></li>
      </ul>
    </div>
  </section>

  <!-- Filters & Grid -->
  <section class="products-grid py-5">
    <div class="container">
      <div class="row">
        <div class="col-md-3">
          <div class="filters">
            <h6>Size</h6>
            <ul class="list-unstyled">
              <li><button class="btn btn-outline-dark m-1">XS</button></li>
              <li><button class="btn btn-outline-dark m-1">S</button></li>
              <li><button class="btn btn-outline-dark m-1">M</button></li>
              <li><button class="btn btn-outline-dark m-1">L</button></li>
              <li><button class="btn btn-outline-dark m-1">XL</button></li>
              <li><button class="btn btn-outline-dark m-1">2X</button></li>
            </ul>
            <h6>Availability</h6>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="avail">
              <label class="form-check-label" for="avail">Available (450)</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="outstock">
              <label class="form-check-label" for="outstock">Out Of Stock (18)</label>
            </div>
            <h6>Category</h6>
            <!-- Dropdown or links -->
            <h6>Colors</h6>
            <!-- Color swatches -->
            <h6>Price Range</h6>
            <!-- Slider or input -->
            <h6>Collections</h6>
            <h6>Tags</h6>
            <h6>Ratings</h6>
          </div>
        </div>
        <div class="col-md-9">
          <div class="row g-4">
            <div class="col-md-4">
              <div class="product-card">
                <img src="https://images.unsplash.com/photo-1554568218-0f1715e72254?w=600" alt="Product" class="img-fluid">
                <h5>Cotton T-Shirt Basic Slim Fit T-Shirt</h5>
                <p class="price">$199</p>
              </div>
            </div>
            <!-- Yana 5 ta product takrorlang -->
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer (index.html dagi bilan bir xil) -->
  <footer class="py-5 bg-dark text-white">
    <!-- ... (nusxa) -->
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
